<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login — Northline</title>
  <meta name="description" content="Open your Northline member desk.">
  <meta name="theme-color" content="#17312c">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="login">
  <main class="login-shell">
    <section class="login-panel">
      <a class="logo" href="index.html" aria-label="Northline home">
        <svg class="mark" viewBox="0 0 32 32" aria-hidden="true"><path fill="currentColor" d="M6.2 26V6h4.1l11.2 13.8V6H25.8v20h-4.1L10.5 12.2V26H6.2z"/></svg>
        <span>Northline</span>
        <i class="logo-dot"></i>
      </a>
      <div>
        <p class="eyebrow" style="color:rgba(246,242,234,.72)">Member desk</p>
        <h1>Your trips, held in one place.</h1>
      </div>
      <p class="lede">Fares, drivers, and what is still ahead. This demo desk is already filled in.</p>
    </section>
    <div class="login-main" id="main">
      <form id="login-form" class="login-card">
        <h2>Login</h2>
        <p class="fine" id="login-hint">Filled in for this demo. Nothing to type.</p>
        <label class="field">
          <span>Member ID</span>
          <input id="member-id" type="password" readonly autocomplete="new-password" spellcheck="false" aria-describedby="login-hint">
        </label>
        <label class="field">
          <span>Passcode</span>
          <input id="passcode" type="password" readonly autocomplete="new-password" spellcheck="false" aria-describedby="login-hint">
        </label>
        <p id="login-error" class="alert" role="alert" hidden>Those details were not recognized.</p>
        <button class="btn btn-primary btn-full" type="submit" autofocus>Login</button>
        <a class="text-link" href="index.html">Back to Northline</a>
      </form>
    </div>
  </main>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
